<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidal Memory — Sedimentary Drift</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500;600i&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f0ede4 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 300px;
            flex-shrink: 0;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20,20,19,0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 22px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 4px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 12px;
            font-style: italic;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .control-section { margin-bottom: 28px; }

        .control-section h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
            font-size: 16px;
        }

        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 10px 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 10px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217,119,87,0.12);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 6px;
        }

        .control-group { margin-bottom: 18px; }

        .control-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 7px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 15px;
            height: 15px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: var(--anthropic-mid-gray);
            min-width: 48px;
            text-align: right;
        }

        .color-group { margin-bottom: 14px; }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 5px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: var(--anthropic-mid-gray);
        }

        button {
            padding: 9px 14px;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--anthropic-light-gray);
            color: var(--anthropic-dark);
            width: 100%;
        }

        button:hover {
            background: var(--anthropic-orange);
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(217,119,87,0.3);
        }

        button.primary {
            background: var(--anthropic-orange);
            color: white;
        }

        button.primary:hover {
            background: #c86641;
        }

        .button-row { display: flex; flex-direction: column; gap: 8px; }

        .divider {
            border: none;
            border-top: 1px solid var(--anthropic-light-gray);
            margin: 4px 0 20px 0;
        }

        /* Canvas area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas-container canvas {
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(20,20,19,0.18);
            display: block;
            max-width: 100%;
            max-height: calc(100vh - 40px);
        }

        .loading {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            padding: 40px;
        }

        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--anthropic-green);
            margin-right: 6px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .status-bar {
            font-size: 11px;
            color: var(--anthropic-mid-gray);
            margin-top: 8px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Tidal Memory</h1>
            <p class="subtitle">Sedimentary Drift — particles accumulate like time, convergences emerge unplanned</p>

            <!-- Seed Section -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" class="seed-input" id="seed-input" value="42731" onchange="updateSeed()" min="1">
                <div class="seed-controls">
                    <button onclick="previousSeed()">← Prev</button>
                    <button onclick="nextSeed()">Next →</button>
                </div>
                <button onclick="randomSeedAndUpdate()" class="primary">Random Seed</button>
                <div class="status-bar" id="status-bar"><span class="status-dot"></span>drawing...</div>
            </div>

            <hr class="divider">

            <!-- Parameters Section -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Particle Count</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="200" max="3000" step="100" value="1200" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">1200</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Wave Depth</label>
                    <div class="slider-container">
                        <input type="range" id="waveDepth" min="0.3" max="3.0" step="0.1" value="1.2" oninput="updateParam('waveDepth', this.value)">
                        <span class="value-display" id="waveDepth-value">1.2</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Frequency Layers</label>
                    <div class="slider-container">
                        <input type="range" id="freqLayers" min="1" max="6" step="1" value="3" oninput="updateParam('freqLayers', this.value)">
                        <span class="value-display" id="freqLayers-value">3</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Drift Speed</label>
                    <div class="slider-container">
                        <input type="range" id="driftSpeed" min="0.3" max="3.0" step="0.1" value="1.0" oninput="updateParam('driftSpeed', this.value)">
                        <span class="value-display" id="driftSpeed-value">1.0</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Sediment Opacity</label>
                    <div class="slider-container">
                        <input type="range" id="opacity" min="3" max="40" step="1" value="12" oninput="updateParam('opacity', this.value)">
                        <span class="value-display" id="opacity-value">12</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Turbulence</label>
                    <div class="slider-container">
                        <input type="range" id="turbulence" min="0.0" max="1.0" step="0.05" value="0.35" oninput="updateParam('turbulence', this.value)">
                        <span class="value-display" id="turbulence-value">0.35</span>
                    </div>
                </div>
            </div>

            <hr class="divider">

            <!-- Colors Section -->
            <div class="control-section">
                <h3>Colors</h3>
                <div class="color-group">
                    <label>Deep Stratum</label>
                    <div class="color-picker-container">
                        <input type="color" id="colorDeep" value="#1a2744" onchange="updateColor('colorDeep', this.value)">
                        <span class="color-value" id="colorDeep-value">#1a2744</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Surface Energy</label>
                    <div class="color-picker-container">
                        <input type="color" id="colorSurface" value="#d97757" onchange="updateColor('colorSurface', this.value)">
                        <span class="color-value" id="colorSurface-value">#d97757</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Middle Age</label>
                    <div class="color-picker-container">
                        <input type="color" id="colorMid" value="#788c5d" onchange="updateColor('colorMid', this.value)">
                        <span class="color-value" id="colorMid-value">#788c5d</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Foam / Highlight</label>
                    <div class="color-picker-container">
                        <input type="color" id="colorFoam" value="#c9c0a8" onchange="updateColor('colorFoam', this.value)">
                        <span class="color-value" id="colorFoam-value">#c9c0a8</span>
                    </div>
                </div>
            </div>

            <hr class="divider">

            <!-- Actions -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button onclick="clearAndRestart()">Clear Canvas</button>
                    <button onclick="resetParameters()">Reset Parameters</button>
                    <button class="primary" onclick="downloadCanvas()">Download PNG</button>
                </div>
            </div>
        </div>

        <!-- Canvas -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Composing sediment layers…</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════
        // TIDAL MEMORY — SEDIMENTARY DRIFT
        // Particles fall through layered sinusoidal displacement fields.
        // Convergent paths leave sediment. Time accumulates into form.
        // ═══════════════════════════════════════════════════════════

        let params = {
            seed: 42731,
            particleCount: 1200,
            waveDepth: 1.2,
            freqLayers: 3,
            driftSpeed: 1.0,
            opacity: 12,
            turbulence: 0.35,
            colorDeep:    '#1a2744',
            colorSurface: '#d97757',
            colorMid:     '#788c5d',
            colorFoam:    '#c9c0a8'
        };

        const defaultParams = JSON.parse(JSON.stringify(params));

        // Each particle is a messenger carrying phase info from birth
        let particles = [];
        let frameCount_local = 0;

        // Frequency layer configs derived from seed — set during init
        let layers = [];

        // p5 instance
        let sketch = function(p) {

            p.setup = function() {
                let cnv = p.createCanvas(900, 900);
                cnv.parent('canvas-container');
                document.querySelector('.loading').style.display = 'none';
                initializeSystem(p);
            };

            p.draw = function() {
                // Run a batch of particle steps each frame for smooth accumulation
                let batchSize = Math.ceil(params.particleCount / 6);
                for (let i = 0; i < batchSize; i++) {
                    let pt = particles[frameCount_local % particles.length];
                    stepParticle(p, pt);
                    frameCount_local++;
                }
                updateStatusBar();
            };
        };

        let myp5 = new p5(sketch);

        // ──────────────────────────────────────────────────────────
        // INITIALIZATION
        // ──────────────────────────────────────────────────────────

        function initializeSystem(p) {
            p = p || myp5;
            frameCount_local = 0;

            p.randomSeed(params.seed);
            p.noiseSeed(params.seed);

            // Build frequency layers — each has its own amplitude, frequency, phase offset
            layers = [];
            let baseFreq = 0.012 + p.random(-0.003, 0.003);
            for (let i = 0; i < params.freqLayers; i++) {
                let harmonicMult = Math.pow(2.1 + p.random(-0.3, 0.3), i);
                layers.push({
                    freq:  baseFreq * harmonicMult,
                    amp:   (params.waveDepth * 60) / harmonicMult,  // higher harmonics = smaller amplitude
                    phase: p.random(0, p.TWO_PI),
                    dir:   p.random() > 0.5 ? 1 : -1,
                    noiseOctave: p.random(1000) // offset for noise field
                });
            }

            // Spawn particles uniformly across top
            particles = [];
            for (let i = 0; i < params.particleCount; i++) {
                particles.push(makeParticle(p, i));
            }

            // Background — parchment
            p.background(248, 244, 236);
        }

        // ──────────────────────────────────────────────────────────
        // PARTICLE CREATION
        // ──────────────────────────────────────────────────────────

        function makeParticle(p, idx) {
            // Particles born along the top with slight vertical scatter
            let x = p.random(0, p.width);
            let y = p.random(-20, 30);
            // Phase offset unique to this particle — its "memory"
            let phase = (idx / params.particleCount) * p.TWO_PI * 7 + p.random(0, p.TWO_PI);
            // Birth color position (0 = deep, 1 = surface) based on x position + noise
            let colorPos = (x / p.width) + p.noise(x * 0.003, idx * 0.001) * 0.6;
            return { x, y, phase, colorPos, alive: true, age: 0 };
        }

        // ──────────────────────────────────────────────────────────
        // PARTICLE STEP — THE CORE ALGORITHM
        // ──────────────────────────────────────────────────────────

        function stepParticle(p, pt) {
            if (!pt.alive) {
                // Respawn from top
                Object.assign(pt, makeParticle(p, Math.floor(p.random(params.particleCount))));
                return;
            }

            // Compute horizontal displacement from all frequency layers
            // This is the sedimentary drift: each layer bends the path
            let dx = 0;
            for (let L of layers) {
                let progressY = pt.y / p.height; // 0 at top, 1 at bottom
                // Wave displacement varies with depth (y), particle phase, and layer frequency
                let wave = Math.sin(pt.x * L.freq + pt.phase + progressY * 4.0 + L.phase) * L.amp;
                dx += wave * L.dir * (1.0 / layers.length);
            }

            // Turbulence: Perlin noise perturbation
            let turbX = (p.noise(pt.x * 0.004 + L_noiseOff(0), pt.y * 0.004) - 0.5) * params.turbulence * 80;
            let turbY = (p.noise(pt.x * 0.004, pt.y * 0.004 + L_noiseOff(1)) - 0.5) * params.turbulence * 20;

            let speed = params.driftSpeed;
            let prevX = pt.x;
            let prevY = pt.y;

            pt.x += (dx * 0.04 * speed) + turbX * 0.2;
            pt.y += speed * (0.8 + turbY * 0.1);
            pt.age++;

            // Kill when fallen off canvas
            if (pt.y > p.height + 10 || pt.x < -50 || pt.x > p.width + 50) {
                pt.alive = false;
                return;
            }

            // Color: blend between 4 palette colors based on x-position + colorPos + age
            let t = (pt.colorPos + (pt.x / p.width) * 0.5) % 1.0;
            let col = samplePalette(p, t);

            // Opacity: thinner near edges, builds up in convergence zones
            let edgeFade = Math.min(pt.x / 60, (p.width - pt.x) / 60, 1);
            let al = (params.opacity / 255) * edgeFade * Math.min(pt.age / 20, 1);

            p.stroke(p.red(col), p.green(col), p.blue(col), al * 255);
            p.strokeWeight(0.85);
            p.noFill();
            p.line(prevX, prevY, pt.x, pt.y);
        }

        // Helper: noise offsets per layer (stable per init)
        function L_noiseOff(i) {
            return layers.length > 0 ? layers[i % layers.length].noiseOctave : 0;
        }

        // ──────────────────────────────────────────────────────────
        // PALETTE — 4-stop geological color ramp
        // ──────────────────────────────────────────────────────────

        function hexToRgb(hex) {
            let r = parseInt(hex.slice(1,3),16);
            let g = parseInt(hex.slice(3,5),16);
            let b = parseInt(hex.slice(5,7),16);
            return [r,g,b];
        }

        function samplePalette(p, t) {
            // 4 stops: deep (0), mid (0.33), surface (0.66), foam (1)
            let stops = [
                hexToRgb(params.colorDeep),
                hexToRgb(params.colorMid),
                hexToRgb(params.colorSurface),
                hexToRgb(params.colorFoam)
            ];
            t = Math.max(0, Math.min(1, t));
            let seg = t * (stops.length - 1);
            let i = Math.floor(seg);
            let f = seg - i;
            if (i >= stops.length - 1) return p.color(...stops[stops.length-1]);
            let a = stops[i], b2 = stops[i+1];
            return p.color(
                a[0] + (b2[0]-a[0]) * f,
                a[1] + (b2[1]-a[1]) * f,
                a[2] + (b2[2]-a[2]) * f
            );
        }

        // ──────────────────────────────────────────────────────────
        // UI HANDLERS
        // ──────────────────────────────────────────────────────────

        function updateParam(name, val) {
            params[name] = parseFloat(val);
            document.getElementById(name + '-value').textContent = val;
            // Particle count and layer structure changes need reinit
            if (name === 'particleCount' || name === 'freqLayers' || name === 'waveDepth') {
                clearAndRestart();
            }
        }

        function updateColor(name, val) {
            params[name] = val;
            document.getElementById(name + '-value').textContent = val;
        }

        function clearAndRestart() {
            initializeSystem(myp5);
        }

        function updateStatusBar() {
            let drawn = Math.min(frameCount_local, params.particleCount * 30);
            let pct = Math.min(100, Math.round(drawn / (params.particleCount * 20) * 100));
            let bar = document.getElementById('status-bar');
            if (pct < 100) {
                bar.innerHTML = `<span class="status-dot"></span>accumulating sediment… ${pct}%`;
            } else {
                bar.innerHTML = `<span class="status-dot" style="background:var(--anthropic-orange)"></span>settled`;
            }
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let v = parseInt(document.getElementById('seed-input').value);
            if (v && v > 0) { params.seed = v; clearAndRestart(); }
            else updateSeedDisplay();
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay(); clearAndRestart();
        }

        function nextSeed() {
            params.seed++;
            updateSeedDisplay(); clearAndRestart();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay(); clearAndRestart();
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            // Sync sliders
            ['particleCount','waveDepth','freqLayers','driftSpeed','opacity','turbulence'].forEach(k => {
                document.getElementById(k).value = params[k];
                document.getElementById(k + '-value').textContent = params[k];
            });
            ['colorDeep','colorSurface','colorMid','colorFoam'].forEach(k => {
                document.getElementById(k).value = params[k];
                document.getElementById(k + '-value').textContent = params[k];
            });
            updateSeedDisplay();
            clearAndRestart();
        }

        function downloadCanvas() {
            myp5.saveCanvas('tidal-memory-seed-' + params.seed, 'png');
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
